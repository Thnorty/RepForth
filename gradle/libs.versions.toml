[versions]
# --- SDK levels. Single source of truth; consumed by the convention plugins. ---
compileSdk = "36"
targetSdk = "36"
minSdkPhone = "28"   # §4: Android 9
minSdkWear = "30"    # §4: Wear OS 3 baseline

# --- Toolchain ---
agp = "8.9.1"
kotlin = "2.1.20"
# KSP encodes the Kotlin version it was built against. It MUST be bumped in the
# same commit as `kotlin` above, or the processors fail with a version mismatch.
ksp = "2.1.20-2.0.1"

# --- Libraries ---
coreKtx = "1.15.0"
lifecycle = "2.8.7"
activityCompose = "1.10.1"
composeBom = "2025.04.00"
navigationCompose = "2.8.9"
hiltNavigationCompose = "1.2.0"
# Navigation's type-safe routes need the serialization runtime on the compile
# classpath; navigation depends on it internally but does not expose it.
kotlinxSerialization = "1.8.1"
datastore = "1.1.7"
coroutines = "1.10.2"
sqliteJdbc = "3.49.1.0"
room = "2.7.2"
# Pinned to the Dagger release contemporary with Kotlin 2.1.20. Newer Hilt
# releases ship a Gradle plugin built against a newer Kotlin stdlib.
hilt = "2.56.2"
junit = "4.13.2"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }

# Compose — versions come from the BOM, so no version.ref here.
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
androidx-hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hiltNavigationCompose" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }

# Room. `room-ktx` brings the coroutine/Flow DAO support; the compiler is a
# KSP processor, so it is added with `ksp(...)` by the Room convention plugin.
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }

hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }

androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlinx-serialization-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-core", version.ref = "kotlinxSerialization" }

# Test-only: lets the packaged catalog be inspected on the JVM, so the data
# tests §17 asks for do not need a device.
sqlite-jdbc = { group = "org.xerial", name = "sqlite-jdbc", version.ref = "sqliteJdbc" }

junit = { group = "junit", name = "junit", version.ref = "junit" }

# Consumed by build-logic so the convention plugins can configure AGP/Kotlin.
android-gradlePlugin = { group = "com.android.tools.build", name = "gradle", version.ref = "agp" }
kotlin-gradlePlugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }
compose-gradlePlugin = { group = "org.jetbrains.kotlin", name = "compose-compiler-gradle-plugin", version.ref = "kotlin" }
ksp-gradlePlugin = { group = "com.google.devtools.ksp", name = "com.google.devtools.ksp.gradle.plugin", version.ref = "ksp" }
room-gradlePlugin = { group = "androidx.room", name = "room-gradle-plugin", version.ref = "room" }
hilt-gradlePlugin = { group = "com.google.dagger", name = "hilt-android-gradle-plugin", version.ref = "hilt" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
# Navigation's type-safe routes are @Serializable objects, so the plugin is a
# navigation dependency here, not a JSON one. Its version is the Kotlin version.
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
room = { id = "androidx.room", version.ref = "room" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }

# --- RepForth convention plugins (build-logic). Modules apply these, never raw config. ---
repforth-android-application = { id = "repforth.android.application" }
repforth-android-library = { id = "repforth.android.library" }
repforth-android-compose = { id = "repforth.android.compose" }
repforth-android-hilt = { id = "repforth.android.hilt" }
repforth-android-room = { id = "repforth.android.room" }
