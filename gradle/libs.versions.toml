[versions]
# --- SDK levels. Single source of truth; consumed by the convention plugins. ---
compileSdk = "36"
targetSdk = "36"
minSdkPhone = "28"   # §4: Android 9
minSdkWear = "30"    # §4: Wear OS 3 baseline

# --- Toolchain ---
agp = "8.9.1"
kotlin = "2.1.20"
# KSP encodes the Kotlin version it was built against. It MUST be bumped in the
# same commit as `kotlin` above, or the processors fail with a version mismatch.
ksp = "2.1.20-2.0.1"

# --- Libraries ---
# §19 Phase 3: baseline profiles. The macrobenchmark library generates the
# profile and the installer applies it at first launch; both come from the same
# release train, so they move together.
# §11: the Wear Data Layer. `play-services-wearable` is the only Google
# dependency in this app and is unavoidable -- DataClient and MessageClient
# have no AndroidX equivalent.
# §11: Wear OS UI. Material 3 for Wear is its own artifact line, versioned
# apart from the phone's Compose BOM.
# Material 3 for Wear and the Wear foundation ship on one version line.
wearCompose = "1.6.2"
playServicesWearable = "18.2.0"
benchmark = "1.3.4"
profileinstaller = "1.4.1"
uiautomator = "2.3.0"
coreKtx = "1.15.0"
lifecycle = "2.8.7"
activityCompose = "1.10.1"
composeBom = "2025.04.00"
navigationCompose = "2.8.9"
hiltNavigationCompose = "1.2.0"
# Navigation's type-safe routes need the serialization runtime on the compile
# classpath; navigation depends on it internally but does not expose it.
kotlinxSerialization = "1.8.1"
datastore = "1.1.7"
# §8: the provider secret is encrypted with Tink authenticated encryption
# under a non-exportable Android Keystore key.
tink = "1.18.0"
coroutines = "1.10.2"
# §8: "Do not depend on a vendor SDK in domain code. Direct HTTP clients make
# dynamic endpoints, local model servers, and consistent cancellation/error
# handling easier." One client, two adapters written against it.
#
# Pinned below latest, and pinned to the compileSdk above. `okhttp-android`
# declares a minCompileSdk in its AAR metadata: 5.4.0 requires 36, 5.5.0
# requires 37, and AGP 8.9.1 will not compile against 37. So bumping this needs
# compileSdk and AGP to move first, and the failure if they do not is an AAR
# metadata error at app assembly — not at the point the version is changed.
okhttp = "5.4.0"
# §9: "Use one app-wide Coil ImageLoader with memory and disk caches."
coil = "3.1.0"
sqliteJdbc = "3.49.1.0"
room = "2.7.2"
# Pinned to the Dagger release contemporary with Kotlin 2.1.20. Newer Hilt
# releases ship a Gradle plugin built against a newer Kotlin stdlib.
hilt = "2.56.2"
junit = "4.13.2"
# §17 asks for instrumentation tests. These are the smallest set that runs a
# real activity with a real Hilt graph on a real device.
androidxTestJunit = "1.2.1"
androidxTestRunner = "1.6.2"
# Its own line: `rules` has never shipped a 1.6.2, so sharing the runner's
# version ref failed to resolve. 1.6.1 is the stable pair for runner 1.6.2.
androidxTestRules = "1.6.1"
espresso = "3.6.1"
# Screenshot tests. Roborazzi renders Compose on the JVM through Robolectric, so
# the whole matrix -- English and Turkish, 1x and 2x font scale -- runs in
# `./gradlew test` with no device attached. Robolectric is pinned below the
# compileSdk deliberately; see `RepForthScreenshotTest`.
robolectric = "4.14.1"
roborazzi = "1.42.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }

# Compose — versions come from the BOM, so no version.ref here.
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
androidx-hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hiltNavigationCompose" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }

# Room. `room-ktx` brings the coroutine/Flow DAO support; the compiler is a
# KSP processor, so it is added with `ksp(...)` by the Room convention plugin.
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
# Only for instrumentation: MigrationTestHelper needs a real SQLite, so a
# migration cannot be exercised on the JVM.
androidx-room-testing = { group = "androidx.room", name = "room-testing", version.ref = "room" }

hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }

tink-android = { group = "com.google.crypto.tink", name = "tink-android", version.ref = "tink" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlinx-serialization-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-core", version.ref = "kotlinxSerialization" }

okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
# The provider adapters are tested against a local server rather than a mock of
# the client: what is worth asserting is the bytes on the wire and what happens
# to a real 401, and a mocked OkHttp asserts neither.
okhttp-mockwebserver = { group = "com.squareup.okhttp3", name = "mockwebserver3", version.ref = "okhttp" }

coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
coil-network-okhttp = { group = "io.coil-kt.coil3", name = "coil-network-okhttp", version.ref = "coil" }
coil-gif = { group = "io.coil-kt.coil3", name = "coil-gif", version.ref = "coil" }

# Test-only: lets the packaged catalog be inspected on the JVM, so the data
# tests §17 asks for do not need a device.
sqlite-jdbc = { group = "org.xerial", name = "sqlite-jdbc", version.ref = "sqliteJdbc" }

junit = { group = "junit", name = "junit", version.ref = "junit" }

# Instrumentation. compose-ui-test-junit4 takes its version from the Compose BOM.
androidx-test-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestJunit" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTestRunner" }
# GrantPermissionRule: an emulator denies POST_NOTIFICATIONS, a phone that has
# been through onboarding has already granted it, and the difference kills the
# activity rather than failing an assertion.
androidx-test-rules = { group = "androidx.test", name = "rules", version.ref = "androidxTestRules" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }

# Baseline profiles. `benchmark-macro-junit4` drives a real app on a real
# device to record the profile; `profileinstaller` is what makes the recorded
# profile do anything on a user's phone.
androidx-wear-compose-material3 = { group = "androidx.wear.compose", name = "compose-material3", version.ref = "wearCompose" }
androidx-wear-compose-foundation = { group = "androidx.wear.compose", name = "compose-foundation", version.ref = "wearCompose" }
play-services-wearable = { group = "com.google.android.gms", name = "play-services-wearable", version.ref = "playServicesWearable" }
# Turns the Data Layer's Task API into suspend functions, so the bridge
# reads like the rest of the codebase instead of like callbacks.
kotlinx-coroutines-play-services = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-play-services", version.ref = "coroutines" }
androidx-benchmark-macro-junit4 = { group = "androidx.benchmark", name = "benchmark-macro-junit4", version.ref = "benchmark" }
androidx-profileinstaller = { group = "androidx.profileinstaller", name = "profileinstaller", version.ref = "profileinstaller" }
androidx-test-uiautomator = { group = "androidx.test.uiautomator", name = "uiautomator", version.ref = "uiautomator" }
hilt-android-testing = { group = "com.google.dagger", name = "hilt-android-testing", version.ref = "hilt" }

# Screenshot tests, on the JVM.
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
roborazzi = { group = "io.github.takahirom.roborazzi", name = "roborazzi", version.ref = "roborazzi" }
roborazzi-compose = { group = "io.github.takahirom.roborazzi", name = "roborazzi-compose", version.ref = "roborazzi" }
roborazzi-junit-rule = { group = "io.github.takahirom.roborazzi", name = "roborazzi-junit-rule", version.ref = "roborazzi" }

# Consumed by build-logic so the convention plugins can configure AGP/Kotlin.
android-gradlePlugin = { group = "com.android.tools.build", name = "gradle", version.ref = "agp" }
kotlin-gradlePlugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }
compose-gradlePlugin = { group = "org.jetbrains.kotlin", name = "compose-compiler-gradle-plugin", version.ref = "kotlin" }
ksp-gradlePlugin = { group = "com.google.devtools.ksp", name = "com.google.devtools.ksp.gradle.plugin", version.ref = "ksp" }
room-gradlePlugin = { group = "androidx.room", name = "room-gradle-plugin", version.ref = "room" }
hilt-gradlePlugin = { group = "com.google.dagger", name = "hilt-android-gradle-plugin", version.ref = "hilt" }
baselineprofile-gradlePlugin = { group = "androidx.benchmark", name = "benchmark-baseline-profile-gradle-plugin", version.ref = "benchmark" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
# Navigation's type-safe routes are @Serializable objects, so the plugin is a
# navigation dependency here, not a JSON one. Its version is the Kotlin version.
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
room = { id = "androidx.room", version.ref = "room" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
android-test = { id = "com.android.test", version.ref = "agp" }
androidx-baselineprofile = { id = "androidx.baselineprofile", version.ref = "benchmark" }

# --- RepForth convention plugins (build-logic). Modules apply these, never raw config. ---
repforth-android-application = { id = "repforth.android.application" }
repforth-android-library = { id = "repforth.android.library" }
repforth-android-compose = { id = "repforth.android.compose" }
repforth-android-hilt = { id = "repforth.android.hilt" }
repforth-android-room = { id = "repforth.android.room" }
repforth-android-instrumentation = { id = "repforth.android.instrumentation" }
repforth-android-screenshot = { id = "repforth.android.screenshot" }
repforth-wear-application = { id = "repforth.wear.application" }
repforth-baselineprofile-consumer = { id = "repforth.baselineprofile.consumer" }
repforth-baselineprofile-producer = { id = "repforth.baselineprofile.producer" }
