name: CI

# Every guarantee in this repository — the token/XML colour guard, the schema
# guard, the string parity guard — holds only if something runs them. This is
# that something.
on:
  pull_request:
  push:
    branches: [master]

# A superseded run tells you nothing useful, so stop paying for it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Runs first and alone: the wrapper JAR is executable code committed as a
  # binary, and a tampered one would run before any other check could object.
  wrapper:
    name: Validate Gradle wrapper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4

  build:
    name: Build and test
    runs-on: ubuntu-latest
    needs: wrapper
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Only the default branch writes the shared cache; pull requests read
          # it. Otherwise a branch can poison the cache for everyone else.
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}

      # A committed key is not recoverable by deleting it — the object stays in
      # history. Cheaper to refuse the commit. GitHub's own secret scanning and
      # push protection cover known token formats; this covers the file shapes
      # that are ours, and needs no third-party action to do it.
      - name: Secret hygiene
        run: |
          # `.env.example` is required by §18 and must contain no real key,
          # so it is the one allowed match.
          leaked=$(git ls-files             | grep -Ei '(^|/)(local\.properties|\.env(\..*)?$)|\.(jks|keystore|p12|pem|key)$'             | grep -vE '(^|/)\.env\.example$' || true)
          if [ -n "$leaked" ]; then
            echo "::error::Files that must never be committed are tracked:"
            echo "$leaked"
            exit 1
          fi
          echo "No credential-shaped files are tracked."

          # Phase 2 lets a user paste a provider key into the app, which makes
          # a key pasted into a fixture, a test, or a doc a live risk rather
          # than a hypothetical one. Filenames cannot catch that; content can.
          # These are the two shapes this app actually accepts (§8), and both
          # are recognisable enough to match without false positives.
          keys=$(git grep -nIE 'AIza[0-9A-Za-z_-]{35}|sk-[A-Za-z0-9]{32,}' -- . || true)
          if [ -n "$keys" ]; then
            echo "::error::Something shaped like a provider API key is committed:"
            echo "$keys"
            exit 1
          fi
          echo "No provider keys found in tracked content."

      # §6 step 1: the pinned dataset commit lives in exactly one file, so
      # metadata and media cannot drift to different commits.
      - name: Verify dataset pin
        run: tools/verify-dataset-pin.sh

      # §20: the public source must build with placeholder media and no private
      # credentials. Building the default flavour is the check for that claim.
      # `licensed` is deliberately not built here — it has no assets yet, and
      # once it does, they must not reach a public CI runner (§18).
      - name: Assemble
        run: ./gradlew assemblePlaceholderDebug --stacktrace

      - name: Unit tests
        run: ./gradlew test --stacktrace

      - name: Android Lint
        run: ./gradlew lint --stacktrace

      # Reports are only interesting when something broke, and they are the
      # first thing anyone asks for.
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
            # Roborazzi writes a side-by-side comparison per failed golden.
            # Without it a screenshot failure says only "is changed", which is
            # the one thing already obvious.
            **/build/outputs/roborazzi/
          retention-days: 7

      # The APK is not published. §18 keeps build outputs out of public CI
      # artifacts, and there is nothing to gain from a debug build of a
      # placeholder flavour that anyone can produce locally.

  # The two suites that cannot run on the JVM, on an emulator this workflow
  # defines rather than a phone nobody here has.
  #
  # Its own job, not a step in `build`: it boots an emulator, so it is the
  # slowest thing here, and nothing in it depends on lint or the goldens. Run
  # side by side, it costs the wall-clock of the longer one instead of the sum.
  #
  # **These tests existed for days without CI ever running them.** A library
  # module has no managed device unless one is declared, so the only target was
  # a plugged-in phone — which a hosted runner does not have. They were run once
  # by hand, on a Galaxy S23, and nothing would have noticed if the next change
  # had broken them.
  device-tests:
    name: Device tests
    runs-on: ubuntu-latest
    needs: wrapper
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}

      # Without this the emulator falls back to software rendering and either
      # crawls or times out. Hosted Linux runners expose /dev/kvm but not to an
      # unprivileged user, so the rule is the standard way to hand it over.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # §7 forbids destructive migration, and §18 asks for migration tests for
      # every released database version. `core:secrets` joins it because the
      # Android Keystore does not exist on the JVM either, and both want the
      # same emulator.
      - name: Migrations and keystore storage
        run: >
          ./gradlew
          :core:database:pixel6Api34DebugAndroidTest
          :core:secrets:pixel6Api34DebugAndroidTest
          --stacktrace

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: device-test-reports
          path: |
            **/build/reports/androidTests/
            **/build/outputs/androidTest-results/
          retention-days: 7

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    # Pull-request only: the action compares the base and head dependency
    # graphs, and a push has nothing to compare against.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: on-failure
