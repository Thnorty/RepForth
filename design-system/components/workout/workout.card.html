<!-- @dsCard group="Components" viewport="700x440" name="Workout — plan, exercise, sets, rest" subtitle="Domain components where numbers lead" -->
<!DOCTYPE html><html data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>body{background:var(--surface-app);padding:20px;margin:0}.k{font:700 11px/1 var(--font-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--text-quiet)}.sec{display:flex;flex-direction:column;gap:8px}.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script></head><body><div id="root"></div>
<script type="text/babel">
const { PlanCard, ExerciseCard, SetRow, SetRowHeader, RestTimer, Button, Icon } = window.RepForthDesignSystem_c95a40;
function Demo(){
  const [done,setDone]=React.useState({1:true,2:true});
  const [rem,setRem]=React.useState(62);
  React.useEffect(()=>{const t=setInterval(()=>setRem(s=>s<=0?90:s-1),1000);return()=>clearInterval(t)},[]);
  return (<div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:24,alignItems:'start'}}>
    <div className="sec"><span className="k">Plan card</span>
      <PlanCard today badge="Today" name="Push Day A" exercises={6} exercisesLabel="exercises" minutes={48}
        muscles={[{label:'Chest',icon:'accessibility_new'},{label:'Shoulders',icon:'sports_martial_arts'},{label:'Triceps',icon:'exercise'}]}
        action={<Button variant="filled" size="lg" icon="play_arrow" fullWidth>Start workout</Button>} />
      <span className="k">Exercise cards</span>
      <ExerciseCard name="Barbell bench press" sets={4} reps={8} tags={[{label:'Chest',icon:'accessibility_new'},{label:'Barbell',icon:'exercise'}]} trailing={<Icon name="drag_handle" />} />
      <ExerciseCard name="Eğimli dambıl press" sets={3} reps={12} tags={[{label:'Göğüs',icon:'accessibility_new'},{label:'Dambıl',icon:'fitness_center'}]} trailing={<Icon name="drag_handle" />} />
    </div>
    <div className="sec"><span className="k">Set rows</span>
      <div style={{background:'var(--surface-card)',borderRadius:12,padding:'12px 8px'}}>
        <SetRowHeader weightLabel="Weight" repsLabel="Reps" />
        <SetRow index={1} weight={80} reps={8} previous="Last: 77.5 kg × 8" done={!!done[1]} onToggle={()=>setDone(d=>({...d,1:!d[1]}))} />
        <SetRow index={2} weight={82.5} reps={8} previous="Last: 80 kg × 8" done={!!done[2]} onToggle={()=>setDone(d=>({...d,2:!d[2]}))} />
        <SetRow index={3} weight={82.5} reps={8} previous="Last: 80 kg × 7" active done={!!done[3]} onToggle={()=>setDone(d=>({...d,3:!d[3]}))} />
        <SetRow index={4} weight={82.5} reps={8} done={!!done[4]} onToggle={()=>setDone(d=>({...d,4:!d[4]}))} />
      </div>
      <span className="k">Rest timer</span>
      <div style={{background:'var(--surface-card)',borderRadius:16}}>
        <RestTimer remaining={rem} total={90} size={170} label="Dinlenme" skipLabel="Atla" nextUp="Sırada: Incline dumbbell press · Set 2" />
      </div>
    </div>
  </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script></body></html>
