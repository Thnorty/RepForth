<!DOCTYPE html><html data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>body{background:var(--surface-app);padding:20px;margin:0}.k{font:700 11px/1 var(--font-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--text-quiet)}.sec{display:flex;flex-direction:column;gap:8px}.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}.frame{width:320px;border-radius:20px;background:var(--color-surface);overflow:hidden}</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script></head><body><div id="root"></div>
<script type="text/babel">
const { TopAppBar, NavigationBar, ListItem, Tabs, Chip, Icon, Badge } = window.RepForthDesignSystem_c95a40;
function Demo(){
  const [tab,setTab]=React.useState('today'),[t,setT]=React.useState('how');
  return (<div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:24}}>
    <div className="sec"><span className="k">Top app bars</span>
      <div className="frame"><TopAppBar large title="Bugün" subtitle="Hafta 4 · Push / Pull / Legs" actions={[{icon:'search',label:'Search'},{icon:'settings',label:'Settings'}]} /></div>
      <div className="frame"><TopAppBar leadingIcon="arrow_back" title="Barbell bench press" subtitle="Chest · Barbell" actions={[{icon:'bookmark',label:'Save',selected:true}]} /></div>
      <span className="k">Tabs</span>
      <div className="frame"><Tabs value={t} onChange={setT} items={[{value:'how',label:'How to'},{value:'hist',label:'History'},{value:'pr',label:'Records',count:3}]} /></div>
    </div>
    <div className="sec"><span className="k">List rows</span>
      <div className="frame" style={{padding:8}}>
        <ListItem mediaIcon="fitness_center" title="Barbell bench press" subtitle={<><Chip icon="accessibility_new" label="Chest" size="sm" /><Chip icon="exercise" label="Barbell" size="sm" /></>} trailingIcon="chevron_right" onClick={()=>{}} />
        <ListItem mediaIcon="fitness_center" title="Incline dumbbell press" subtitle="Chest · Dumbbell" trailing={<Badge tone="accent" icon="trending_up" label="PR" />} onClick={()=>{}} />
        <ListItem mediaIcon="self_improvement" title="Kablo makarası (cable fly)" subtitle="Göğüs · Kablo" trailingIcon="chevron_right" onClick={()=>{}} />
      </div>
      <span className="k">Bottom navigation</span>
      <div className="frame"><NavigationBar value={tab} onChange={setTab} items={[{value:'today',icon:'today',label:'Today'},{value:'plans',icon:'list_alt',label:'Plans'},{value:'catalog',icon:'fitness_center',label:'Exercises'},{value:'you',icon:'insights',label:'Progress'}]} /></div>
    </div>
  </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script></body></html>
