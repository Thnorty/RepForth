<!DOCTYPE html><html data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px 18px;background:var(--surface-app);font-family:var(--font-ui)}.g{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:60px;border-radius:8px;padding:8px;display:flex;flex-direction:column;justify-content:flex-end;height:84px;font-size:11px;font-weight:700;line-height:1.3}.sw i{font-style:normal;font-weight:500;opacity:.72;font-size:10px}.lb{font:700 10px/1 var(--font-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--text-quiet)}.t{display:grid;place-items:center;border-radius:14px;background:var(--color-primary);color:var(--color-on-primary);font-weight:800}.w{display:flex;flex-direction:column;align-items:center;gap:8px}.rf-icon{font-size:28px}</style></head><body>
<div class="g" style="gap:20px;align-items:flex-end">
<div class="w"><div class="t" style="width:40px;height:40px;background:var(--color-surface-container-highest);color:var(--text-quiet)"><span class="rf-icon" style="font-size:20px">close</span></div><span class="lb">40 · secondary only</span></div>
<div class="w"><div class="t" style="width:48px;height:48px"><span class="rf-icon">check</span></div><span class="lb">48 · phone floor</span></div>
<div class="w"><div class="t" style="width:64px;height:64px"><span class="rf-icon" style="font-size:34px">check</span></div><span class="lb">64 · in-session</span></div>
<div class="w"><div class="t" style="width:52px;height:52px;border-radius:999px"><span class="rf-icon">skip_next</span></div><span class="lb">52 · Wear OS</span></div>
<div class="w"><div class="t" style="width:56px;height:56px;border-radius:16px"><span class="rf-icon">add</span></div><span class="lb">56 · FAB</span></div>
</div></body></html>
