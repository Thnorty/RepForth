<!-- @dsCard group="Colors" viewport="700x150" name="Charcoal surfaces (dark)" subtitle="Elevation by tone: lowest → highest container" -->
<!DOCTYPE html><html data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px 18px;background:var(--surface-app);font-family:var(--font-ui)}.g{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:60px;border-radius:8px;padding:8px;display:flex;flex-direction:column;justify-content:flex-end;height:84px;font-size:11px;font-weight:700;line-height:1.3}.sw i{font-style:normal;font-weight:500;opacity:.72;font-size:10px}.lb{font:700 10px/1 var(--font-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--text-quiet)}</style></head><body>
<div class="g">
<div class="sw" style="background:var(--color-surface-container-lowest);color:var(--n-90);box-shadow:inset 0 0 0 1px var(--nv-30)">lowest<i>--color-surface-container-lowest</i></div>
<div class="sw" style="background:var(--color-surface);color:var(--n-90)">surface<i>--color-surface</i></div>
<div class="sw" style="background:var(--color-surface-container);color:var(--n-90)">container<i>--color-surface-container</i></div>
<div class="sw" style="background:var(--color-surface-container-high);color:var(--n-90)">high<i>-high</i></div>
<div class="sw" style="background:var(--color-surface-container-highest);color:var(--n-90)">highest<i>-highest</i></div>
<div class="sw" style="background:var(--nv-30);color:var(--n-90)">outline-variant<i>hairlines</i></div>
<div class="sw" style="background:var(--nv-60);color:var(--n-10)">outline<i>borders, tracks</i></div>
</div></body></html>
