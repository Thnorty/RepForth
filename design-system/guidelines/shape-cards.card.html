<!-- @dsCard group="Shape" viewport="700x200" name="Card treatments" subtitle="Tone, hairline, or shadow — never two at once" -->
<!DOCTYPE html><html data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px 18px;background:var(--surface-app);font-family:var(--font-ui)}.g{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:60px;border-radius:8px;padding:8px;display:flex;flex-direction:column;justify-content:flex-end;height:84px;font-size:11px;font-weight:700;line-height:1.3}.sw i{font-style:normal;font-weight:500;opacity:.72;font-size:10px}.lb{font:700 10px/1 var(--font-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--text-quiet)}.c{flex:1;border-radius:12px;padding:14px;min-height:96px;display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--text-quiet)}.c b{color:var(--text-body);font-size:14px}</style></head><body>
<div class="g" style="gap:12px">
<div class="c" style="background:var(--surface-card)"><b>Filled</b>surface-container. The default: dark UI separates by tone.</div>
<div class="c" style="background:var(--color-surface);box-shadow:inset 0 0 0 1px var(--border-quiet)"><b>Outlined</b>hairline outline-variant. For selectable or nested cards.</div>
<div class="c" style="background:var(--surface-card-raised);box-shadow:var(--elev-2)"><b>Elevated</b>elev-2. Sheets, dialogs, dragged items only.</div>
<div class="c" style="background:var(--color-surface-container-high);box-shadow:inset 0 0 0 1px color-mix(in oklab,var(--color-primary) 35%,transparent)"><b>Accent hairline</b>marks today&#39;s session — one per screen.</div>
</div></body></html>
