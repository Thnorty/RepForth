<!-- @dsCard group="Type" viewport="700x210" name="Hierarchy in use" subtitle="One number dominates; labels recede. Never two heroes in one block." -->
<!DOCTYPE html><html data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px 18px;background:var(--surface-app);font-family:var(--font-ui)}.g{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:60px;border-radius:8px;padding:8px;display:flex;flex-direction:column;justify-content:flex-end;height:84px;font-size:11px;font-weight:700;line-height:1.3}.sw i{font-style:normal;font-weight:500;opacity:.72;font-size:10px}.lb{font:700 10px/1 var(--font-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--text-quiet)}</style></head><body>
<div style="display:flex;gap:14px">
<div style="flex:1;background:var(--surface-card);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:6px">
<span class="rf-overline">Set 3 of 4</span>
<span class="rf-numeric rf-numeric-xl">82.5<span class="rf-unit">kg</span></span>
<span class="rf-label">× 8 reps · last time 80 kg × 8</span>
<span style="margin-top:6px;font:700 11px/1 var(--font-ui);color:var(--color-primary)">RIGHT</span>
</div>
<div style="flex:1;background:var(--surface-card);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:6px;opacity:.85">
<span style="font-family:var(--font-display);font-size:26px;font-weight:800;color:var(--text-strong)">Barbell bench press</span>
<span class="rf-numeric rf-numeric-sm" style="color:var(--text-quiet)">82.5 kg × 8</span>
<span class="rf-label">Set 3 of 4</span>
<span style="margin-top:6px;font:700 11px/1 var(--font-ui);color:var(--color-error)">WRONG — the name outranks the number</span>
</div>
</div></body></html>
