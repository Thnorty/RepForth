<!DOCTYPE html><html data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px 18px;background:var(--surface-app);font-family:var(--font-ui)}.g{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:60px;border-radius:8px;padding:8px;display:flex;flex-direction:column;justify-content:flex-end;height:84px;font-size:11px;font-weight:700;line-height:1.3}.sw i{font-style:normal;font-weight:500;opacity:.72;font-size:10px}.lb{font:700 10px/1 var(--font-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--text-quiet)}.s{display:flex;flex-direction:column;gap:6px;align-items:center}.bar{background:var(--color-primary);height:16px;border-radius:3px}</style></head><body>

<div class="s"><div class="bar" style="width:40px"></div><span class="lb">10 · 40</span></div>
<div class="s"><div class="bar" style="width:48px"></div><span class="lb">12 · 48</span></div>
<div class="s"><div class="bar" style="width:64px"></div><span class="lb">16 · 64</span></div>
</div></body></html>
