<!-- @dsCard group="Spacing" viewport="700x220" name="Phone layout in use" subtitle="16dp gutters, 8dp list gap, 24dp between sections, edge-to-edge media" -->
<!DOCTYPE html><html data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px 18px;background:var(--surface-app);font-family:var(--font-ui)}.g{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:60px;border-radius:8px;padding:8px;display:flex;flex-direction:column;justify-content:flex-end;height:84px;font-size:11px;font-weight:700;line-height:1.3}.sw i{font-style:normal;font-weight:500;opacity:.72;font-size:10px}.lb{font:700 10px/1 var(--font-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--text-quiet)}.ph{width:280px;background:var(--color-surface);border-radius:18px;overflow:hidden;box-shadow:var(--elev-2)}.gut{padding:0 16px}.row{height:56px;background:var(--surface-card);border-radius:12px;margin-bottom:8px}</style></head><body>
<div class="g" style="align-items:flex-start;gap:22px">
<div class="ph">
<div style="height:44px;display:flex;align-items:flex-end;padding:0 16px 6px;font:800 18px var(--font-display);color:var(--text-strong)">Bugün</div>
<div class="gut" style="padding-bottom:24px"><div class="row"></div><div class="row"></div></div>
<div class="gut"><div style="height:8px;background:var(--color-primary);border-radius:999px;margin-bottom:8px"></div><div class="row" style="height:36px"></div></div>
</div>
<div style="display:flex;flex-direction:column;gap:10px;font-size:12px;color:var(--text-quiet);max-width:330px">
<div><b style="color:var(--text-body)">--gutter-phone 16dp</b> — every screen edge on phone.</div>
<div><b style="color:var(--text-body)">--list-row-gap 8dp</b> — between cards in a list.</div>
<div><b style="color:var(--text-body)">--section-gap 24dp</b> — between titled sections.</div>
<div><b style="color:var(--text-body)">Edge-to-edge</b> — media and progress bars may cross the gutter; text never does.</div>
<div><b style="color:var(--text-body)">Optimised for phones</b>, not tablets: content max 412dp, single column.</div>
</div>
</div></body></html>
