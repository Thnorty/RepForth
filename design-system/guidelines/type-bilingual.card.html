<!DOCTYPE html><html data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px 18px;background:var(--surface-app);font-family:var(--font-ui)}.g{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:60px;border-radius:8px;padding:8px;display:flex;flex-direction:column;justify-content:flex-end;height:84px;font-size:11px;font-weight:700;line-height:1.3}.sw i{font-style:normal;font-weight:500;opacity:.72;font-size:10px}.lb{font:700 10px/1 var(--font-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--text-quiet)}.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}.b{background:var(--surface-card);border-radius:10px;padding:10px}.btn{display:flex;align-items:center;justify-content:center;min-height:48px;border-radius:999px;background:var(--color-primary);color:var(--color-on-primary);font-weight:700;font-size:14px;padding:0 16px;text-align:center}</style></head><body>
<div class="pair">
<div class="b"><div class="lb" style="margin-bottom:6px">EN · 13 ch</div><div class="btn">Start workout</div></div>
<div class="b"><div class="lb" style="margin-bottom:6px">TR · 21 ch</div><div class="btn">Antrenmanı başlat</div></div>
<div class="b"><div class="lb" style="margin-bottom:6px">EN · 9 ch</div><div class="btn" style="background:var(--color-surface-container-highest);color:var(--text-body)">Skip rest</div></div>
<div class="b"><div class="lb" style="margin-bottom:6px">TR · 22 ch · wraps, not clipped</div><div class="btn" style="background:var(--color-surface-container-highest);color:var(--text-body);line-height:1.25">Dinlenmeyi atla</div></div>
</div></body></html>
