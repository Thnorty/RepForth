<!-- @dsCard group="Colors" viewport="700x160" name="Semantic roles" subtitle="Rest = amber, info = sky, secondary = sage, destructive = red. Each ships with an icon." -->
<!DOCTYPE html><html data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px 18px;background:var(--surface-app);font-family:var(--font-ui)}.g{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:60px;border-radius:8px;padding:8px;display:flex;flex-direction:column;justify-content:flex-end;height:84px;font-size:11px;font-weight:700;line-height:1.3}.sw i{font-style:normal;font-weight:500;opacity:.72;font-size:10px}.lb{font:700 10px/1 var(--font-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--text-quiet)}.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;font-size:13px;font-weight:700}.rf-icon{font-size:18px}</style></head><body>
<div style="display:flex;flex-direction:column;gap:12px">
<div class="g" style="gap:8px">
<span class="chip" style="background:var(--color-primary);color:var(--color-on-primary)"><span class="rf-icon">bolt</span>Active set</span>
<span class="chip" style="background:var(--color-tertiary-container);color:var(--color-on-tertiary-container)"><span class="rf-icon">schedule</span>Rest 90s</span>
<span class="chip" style="background:var(--color-secondary-container);color:var(--color-on-secondary-container)"><span class="rf-icon">check</span>Completed</span>
<span class="chip" style="background:var(--color-info-container);color:var(--color-on-info-container)"><span class="rf-icon">watch</span>Watch connected</span>
<span class="chip" style="background:var(--color-error-container);color:var(--color-on-error-container)"><span class="rf-icon">error</span>Delete plan</span>
</div>
<div class="lb">Colour never carries the meaning alone — the glyph and the word do.</div>
</div></body></html>
