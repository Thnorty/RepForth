<!DOCTYPE html><html data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px 18px;background:var(--surface-app);font-family:var(--font-ui)}.g{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:60px;border-radius:8px;padding:8px;display:flex;flex-direction:column;justify-content:flex-end;height:84px;font-size:11px;font-weight:700;line-height:1.3}.sw i{font-style:normal;font-weight:500;opacity:.72;font-size:10px}.lb{font:700 10px/1 var(--font-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--text-quiet)}.col{flex:1}.card{background:var(--surface-card);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}.b{display:flex;align-items:center;justify-content:center;min-height:48px;border-radius:999px;background:var(--color-primary);color:var(--color-on-primary);font-weight:700;padding:8px 16px;text-align:center;line-height:1.2}</style></head><body>

<div class="col"><div class="lb" style="margin-bottom:6px">200%</div><div class="card" style="font-size:28px"><span class="rf-numeric" style="font-size:76px">82.5<span class="rf-unit" style="font-size:20px">kg</span></span><span class="rf-label" style="font-size:24px">Working weight</span><div class="b" style="font-size:28px;min-height:72px">Log set</div></div></div>
